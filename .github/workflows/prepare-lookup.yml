name: Prepare Lookup Inputs

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Raw source date, e.g. 260430"
        required: true
        default: "260430"
      body_like_threshold:
        description: "Minimum body_like_count to queue lookup"
        required: true
        default: "4"

permissions:
  contents: read

concurrency:
  group: prepare-lookup-${{ inputs.target_date }}
  cancel-in-progress: false

jobs:
  prepare:
    name: match and prepare lookup rows
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate inputs and configuration
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          BODY_LIKE_THRESHOLD: ${{ inputs.body_like_threshold }}
          RAW_REMOTE_DIR: ${{ vars.RAW_REMOTE_DIR }}
          RUNS_REMOTE_DIR: ${{ vars.RUNS_REMOTE_DIR }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_DATE" =~ ^[0-9]{6}$ ]]; then
            echo "target_date must be 6 digits"
            exit 1
          fi
          if ! [[ "$BODY_LIKE_THRESHOLD" =~ ^[0-9]+$ ]]; then
            echo "body_like_threshold must be a non-negative integer"
            exit 1
          fi
          for name in RAW_REMOTE_DIR RUNS_REMOTE_DIR RCLONE_CONFIG_GDRIVE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required"
              exit 1
            fi
          done

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes rclone

      - name: Configure rclone remote
        shell: bash
        env:
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        run: |
          set -euo pipefail
          config_dir="$HOME/.config/rclone"
          mkdir -p "$config_dir"
          printf '%s' "$RCLONE_CONFIG_GDRIVE" > "$config_dir/rclone.conf"
          chmod 600 "$config_dir/rclone.conf"
          rclone listremotes | grep -q ':$'

      - name: Download raw source
        id: download
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          RAW_REMOTE_DIR: ${{ vars.RAW_REMOTE_DIR }}
        run: |
          set -euo pipefail
          raw_name="threads-source-${TARGET_DATE}.json"
          raw_path="$RUNNER_TEMP/$raw_name"
          raw_uri="${RAW_REMOTE_DIR%/}/$raw_name"

          rclone_retry() {
            local attempt=1 max_attempts=5 delay=15
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then return 1; fi
              echo "rclone attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          rclone_retry rclone --contimeout 10s --timeout 90s copyto "$raw_uri" "$raw_path"
          test -s "$raw_path"
          echo "raw_path=$raw_path" >> "$GITHUB_OUTPUT"
          echo "raw_name=$raw_name" >> "$GITHUB_OUTPUT"

      - name: Prepare lookup inputs
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          BODY_LIKE_THRESHOLD: ${{ inputs.body_like_threshold }}
          RAW_PATH: ${{ steps.download.outputs.raw_path }}
          RAW_NAME: ${{ steps.download.outputs.raw_name }}
        run: |
          set -euo pipefail
          python3 prepare_lookup_inputs.py \
            --date "$TARGET_DATE" \
            --input "$RAW_PATH" \
            --output-dir prepared \
            --body-like-threshold "$BODY_LIKE_THRESHOLD" \
            --source-uri "$RAW_NAME" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-sha "$GITHUB_SHA"

      - name: Upload prepared files to Drive
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          RUNS_REMOTE_DIR: ${{ vars.RUNS_REMOTE_DIR }}
        run: |
          set -euo pipefail
          destination="${RUNS_REMOTE_DIR%/}/$TARGET_DATE"
          rclone_retry() {
            local attempt=1 max_attempts=5 delay=15
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then return 1; fi
              echo "rclone attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          rclone_retry rclone mkdir "$destination"
          rclone_retry rclone --contimeout 10s --timeout 90s copy prepared "$destination"

      - name: Summarize
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          print("### Prepare lookup result")
          for path in sorted(Path("prepared").glob("*")):
              print(f"- {path.name}")
          PY
